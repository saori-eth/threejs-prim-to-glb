<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Scene Generator - Three.js</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        background-color: #1a1a1a; /* Dark background */
        color: #e0e0e0; /* Light text */
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      #controls-container {
        width: 100%;
        max-width: 800px;
        background: rgba(
          30,
          30,
          30,
          0.85
        ); /* Dark, semi-transparent background */
        backdrop-filter: blur(10px); /* Frosted glass effect */
        -webkit-backdrop-filter: blur(10px); /* Safari support */
        padding: 25px;
        border-radius: 12px; /* Slightly more rounded */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37); /* Softer, more modern shadow */
        margin-top: 30px; /* Increased padding from viewer */
        border: 1px solid rgba(255, 255, 255, 0.18); /* Subtle border */
      }
      h1 {
        text-align: center;
        color: #f5f5f5; /* Brighter white for heading */
        margin-top: 25px;
        margin-bottom: 25px; /* Increased margin bottom */
        font-weight: 500; /* Bolder for more interest */
        letter-spacing: 1px; /* Added letter spacing */
        font-size: 2.2em; /* Slightly larger */
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.15); /* Subtle glow */
      }
      label {
        display: block;
        margin-bottom: 10px; /* Increased margin */
        font-weight: 500; /* Medium font weight */
        color: #c7c7c7; /* Lighter gray for labels */
        text-align: center; /* Center labels */
      }
      input[type="text"] {
        display: block; /* To allow margin auto */
        width: calc(100% - 24px);
        max-width: 400px; /* Max width for text input */
        margin-left: auto;
        margin-right: auto;
        padding: 12px;
        margin-bottom: 25px;
        background-color: rgba(0, 0, 0, 0.3); /* Darker input background */
        border: 1px solid rgba(255, 255, 255, 0.2); /* Lighter border */
        border-radius: 6px; /* Softer corners */
        color: #e0e0e0; /* Light text color */
        font-size: 16px;
      }
      input[type="text"]::placeholder {
        color: #888888; /* Placeholder text color */
      }

      select#modelSelect {
        /* Style for the model selector */
        display: block;
        max-width: 350px; /* Specific width for selector */
        padding: 12px;
        margin: 0 auto 25px auto; /* Centering and bottom margin */
        background-color: rgba(0, 0, 0, 0.3); /* Darker select background */
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #e0e0e0;
        font-size: 16px;
      }

      button {
        display: block;
        width: auto; /* Auto width */
        min-width: 180px; /* Minimum width for buttons */
        padding: 12px 25px; /* Adjusted padding */
        margin: 0 auto 15px auto; /* Centering and bottom margin */
        background-color: #555555; /* Grayscale button */
        color: #f0f0f0; /* Light gray text */
        border: none;
        border-radius: 6px; /* Softer corners */
        cursor: pointer;
        font-size: 16px; /* Adjusted font size */
        font-weight: 500;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }
      button:hover {
        background-color: #777777; /* Lighter gray on hover */
        transform: translateY(-1px); /* Subtle lift effect */
      }
      button:disabled {
        background-color: #333333; /* Darker disabled state */
        color: #888888;
        cursor: not-allowed;
        transform: none;
      }
      /* Specific button IDs no longer need separate color styles if all are grayscale */
      /* #downloadButton styling is now covered by general button rules */
      /* #refineButton styling is now covered by general button rules */

      #viewer-container {
        width: 100%;
        max-width: 800px;
        height: 50vh;
        min-height: 400px;
        max-height: 600px;
        margin-top: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle border */
        border-radius: 12px; /* Match controls container */
        background-color: #2a2a2a; /* Dark background for viewer */
        position: relative;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37); /* Match controls container */
      }
      #threejs-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 12px; /* Match parent */
      }
      #status {
        margin-top: 20px;
        text-align: center;
        font-style: italic;
        color: #aaaaaa; /* Lighter status text */
        min-height: 1.2em; /* Prevent layout shift */
      }
    </style>
  </head>
  <body>
    <h1>Three.js GLB Generator</h1>
    <div id="viewer-container">
      <canvas id="threejs-canvas"></canvas>
    </div>
    <div id="controls-container">
      <div>
        <label for="promptInput">Enter your prompt:</label>
        <input
          type="text"
          id="promptInput"
          value="a vibrant red cube next to a small blue sphere"
        />
      </div>
      <div>
        <label for="modelSelect">Select Model:</label>
        <select id="modelSelect">
          <option value="claude-opus-4-5-20251101">
            Claude Opus 4.5 (20251101)
          </option>
          <option value="claude-sonnet-4-5-20250929">
            Claude Sonnet 4.5 (20250929)
          </option>
          <option value="claude-opus-4-20250514">
            Claude Opus 4 (20250514)
          </option>
          <option value="claude-sonnet-4-20250514">
            Claude Sonnet 4 (20250514)
          </option>
        </select>
      </div>
      <button id="generateButton">Generate Scene</button>
      <button id="downloadButton">Download GLB</button>
      <div id="status"></div>
    </div>
    <div
      id="refinement-controls-container"
      style="
        margin-top: 25px;
        width: 100%;
        max-width: 800px;
        background: rgba(30, 30, 30, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        text-align: center;
      "
    >
      <label
        for="refinementPromptInput"
        style="
          display: block;
          margin-bottom: 10px;
          font-weight: 500;
          color: #c7c7c7;
        "
        >Refine the current scene:</label
      >
      <input
        type="text"
        id="refinementPromptInput"
        placeholder="e.g., 'make the cube green', 'add a light from above'"
        style="
          width: calc(100% - 24px);
          max-width: 400px;
          padding: 12px;
          margin-bottom: 15px;
          background-color: rgba(0, 0, 0, 0.3);
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 6px;
          color: #e0e0e0;
          font-size: 16px;
          margin-left: auto;
          margin-right: auto;
          display: block;
        "
      />
      <button id="refineButton">Refine Scene</button>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
